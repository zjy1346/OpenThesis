[package]
name = "openthesis-desktop"
version = "3.2.6"
description = "OpenThesis desktop platform adapter"
authors = ["OpenThesis Contributors"]
edition = "2021"

[lib]
name = "openthesis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = { version = "1.8", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["time", "macros"] }
httpdate = "1"
tempfile = "3.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Networking_WinHttp"] }
