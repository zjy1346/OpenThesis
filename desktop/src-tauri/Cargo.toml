[package]
name = "openthesis-desktop"
version = "1.1.0"
description = "OpenThesis desktop platform adapter"
authors = ["OpenThesis Contributors"]
edition = "2021"

[lib]
name = "openthesis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
