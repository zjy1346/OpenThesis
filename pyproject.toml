[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openthesis"
version = "0.4.0"
description = "Model-agnostic, evidence-grounded AI research for long-term investors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenThesis Contributors"}]
dependencies = []

[project.scripts]
openthesis = "openthesis.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openthesis = ["resources/**/*"]
